[project]
name = "projecteuler-python"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "aiohttp",
    "beautifulsoup4",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring",
    "missing-class-docstring",
    "missing-module-docstring",
]
